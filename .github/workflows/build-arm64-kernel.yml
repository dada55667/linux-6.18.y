name: Build ARM64 Kernel

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag"
        required: true
        default: "6.18.0-test"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex \
            libssl-dev libelf-dev \
            gcc-13-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod cpio u-boot-tools

      - name: Setup compiler
        run: |
          sudo update-alternatives --install \
            /usr/bin/aarch64-linux-gnu-gcc \
            aarch64-linux-gnu-gcc \
            /usr/bin/aarch64-linux-gnu-gcc-13 100

      - name: List available arm64 configs
        run: |
          echo "=== Available arm64 configs ==="
          ls arch/arm64/configs/ 2>/dev/null || echo "No arm64 configs"
          echo ""
          echo "=== Top-level defconfigs ==="
          ls -la arch/arm64/configs/*defconfig* 2>/dev/null

      - name: Configure kernel
        run: |
          rm -rf out
          
          # 尝试多个配置来源
          if [ -f "arch/arm64/configs/defconfig" ]; then
            echo "Using arch/arm64/configs/defconfig"
            make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          elif [ -f ".config" ]; then
            echo "Using existing .config"
            mkdir -p out
            cp .config out/.config
            make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          else
            echo "Creating minimal arm64 config"
            make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          fi
          
          # 关键修复：禁用 ACPI（arm64 设备树系统不需要）
          scripts/config --file out/.config --disable CONFIG_ACPI
          
          # 显示配置状态
          grep CONFIG_ACPI out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image release/
          fi
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz release/
          fi
          if [ -d "out/arch/arm64/boot/dts" ]; then
            mkdir -p release/dtb
            find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} release/dtb/ \;
          fi
          
          # 打包模块
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=./modules 2>/dev/null || true
          if [ -d "modules/lib" ]; then
            tar -czf release/modules.tar.gz -C modules lib
          fi
          
          echo "Kernel built at $(date)" > release/README.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
