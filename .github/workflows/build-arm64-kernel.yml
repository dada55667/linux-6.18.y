name: Build ARM64 Kernel & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. 6.18.0-20260616)"
        required: true
        default: "6.18.0-test"

jobs:
  build:
    runs-on: ubuntu-24.04  # 使用 Ubuntu 24.04 获取更新的工具链
    
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex \
            libssl-dev libelf-dev \
            gcc-13-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod cpio

      - name: Setup cross-compiler
        run: |
          sudo update-alternatives --install \
            /usr/bin/aarch64-linux-gnu-gcc \
            aarch64-linux-gnu-gcc \
            /usr/bin/aarch64-linux-gnu-gcc-13 100
          aarch64-linux-gnu-gcc --version

      - name: Generate .config
        run: |
          rm -rf out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          
          # 显示配置摘要
          grep -c "=y" out/.config && echo "built-in options"
          grep -c "=m" out/.config && echo "module options"

      - name: Build kernel (try without modules first)
        run: |
          # 先只编译内核本身，不编译模块
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
      
      - name: Build modules (separate step)
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=./kernel-modules

      - name: Package artifacts
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image release/
          tar -czf release/kernel-modules.tar.gz -C kernel-modules lib 2>/dev/null || echo "No modules to package"
          echo "Kernel: ${{ github.event.inputs.tag_name }} built $(date)" > release/README.txt

      - name: Create GitHub Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Linux Kernel ${{ github.event.inputs.tag_name }} (arm64)"
          files: |
            release/Image
            release/kernel-modules.tar.gz
            release/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
