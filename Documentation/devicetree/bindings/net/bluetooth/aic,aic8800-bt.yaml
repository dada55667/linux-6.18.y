%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/aic,aic8800-bt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AIC8800 Bluetooth controller

description:
  This binding describes the Bluetooth portion of the AIC8800 WiFi/BT combo
  chip. The Bluetooth side is a plain H4 HCI stream over a 4-wire UART,
  attached through a serdev node. The Bluetooth firmware is loaded by the
  WiFi driver of the same combo chip.

maintainers:
  - AICSemi <aic@aicsemi.com>

allOf:
  - $ref: bluetooth-controller.yaml#

properties:
  compatible:
    const: aic,aic8800-bt

  enable-gpios:
    maxItems: 1
    description:
      GPIO connected to the BT_REG_ON pin of the chip. Asserted to power on
      the Bluetooth subsystem.

  device-wakeup-gpios:
    maxItems: 1
    description:
      GPIO connected to the HOST_WAKE_BT pin. Asserted by the host to wake
      up the Bluetooth controller.

  host-wakeup-gpios:
    maxItems: 1
    description:
      GPIO connected to the BT_WAKE_HOST pin. Used by the controller to wake
      up the host.

  max-speed:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 115200
    description:
      UART baudrate used for the HCI link.

  post-power-on-delay-ms:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 100
    description:
      Delay in milliseconds after asserting enable-gpios before the UART is
      opened.

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    serial {
        bluetooth {
            compatible = "aic,aic8800-bt";
            enable-gpios = <&gpio1 17 GPIO_ACTIVE_HIGH>;
            device-wakeup-gpios = <&gpio1 16 GPIO_ACTIVE_HIGH>;
            host-wakeup-gpios = <&gpio1 18 GPIO_ACTIVE_HIGH>;
            max-speed = <115200>;
            post-power-on-delay-ms = <100>;
        };
    };
